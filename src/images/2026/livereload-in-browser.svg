<svg xmlns="http://www.w3.org/2000/svg" id="graph-592" width="100%" height="100%" viewBox="0 0 980 815">
  <defs>
    <marker id="graph-592-arrowhead" refX="7.9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M -1 0 L 10 5 L 0 10 z"/>
    </marker>
    
    <style>
      #graph-592 {
        --primary-color:      #8b7434;
        --primary-fill:       #f4f1ec;
        --note-border-color:  #d01c11;
        --note-fill:          #f7eae8;
        --block-border-color: #dfdfdf;
        --block-background:   #f3f3f3;
        --body-text:          #202020;
      }

      @media (prefers-color-scheme: dark) {
        #graph-592 {
          --primary-color:      #dfcf96;
          --primary-fill:       #423d2c;
          --red:                #ff4a4a;
          --note-fill:          #4b1616;
          --block-border-color: #434343;
          --block-background:   #1d1d1d;
          --body-text:          #c7c7c7;
        }
      }
      
      #graph-592 {
      	font-size: 16px;
      	fill: #333;
        
        .note {
          stroke: var(--note-border-color);
          fill: var(--note-fill);
        }
        
        text {
          text-anchor: middle;
          dominant-baseline: bottom;
          fill: var(--body-text)
        }
        
        .actor, .note {
          tspan {
            dominant-baseline: middle;
          }
        }

        .actor {
        	stroke: var(--primary-color);
        	fill:   var(--primary-fill);
        	stroke-width: 3;
        }

        text.actor {
        	fill: var(--primary-color);
        	stroke: none;
        }

        .actor-line {
        	stroke: var(--primary-color);
        }

        .messageLine0 {
        	stroke-width: 1.5;
        	stroke-dasharray: none;
        	stroke: var(--body-text);
        }

        .messageLine1 {
        	stroke-width: 1.5;
        	stroke-dasharray: 2, 2;
        	stroke: var(--body-text);
        }

        .messageText {
        	fill: var(--body-text);
        	stroke: none;
        }
        
        .noteText {
          fill: var(--note-border-color);
        }

        line {
        	fill: var(--block-background);
        	stroke-width: 2px;
        }
      }
      
      #graph-592-arrowhead path {
        fill: var(--body-text);
      }
    </style>
  </defs>
  <g style="transform: matrix(1.449464, 0, 0, 1.449464, 15, 4);">
    <g>
      <rect x="478" y="492" fill="#eaeaea" stroke="#666" width="150" height="65" name="WB" rx="3" ry="3" class="actor actor-bottom"/>
      <text x="553" y="524.5" class="actor actor-box">
        <tspan x="553" dy="0">Web browser</tspan>
      </text>
