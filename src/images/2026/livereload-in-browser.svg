    <g>
      <line id="actor3625" x1="297" y1="65" x2="297" y2="492" class="actor-line 200" stroke-width="0.5px" stroke="#999" name="PS" data-et="life-line" data-id="PS"/>
      <g id="root-3625" data-et="participant" data-type="participant" data-id="PS">
        <rect x="208.5" y="0" fill="#eaeaea" stroke="#666" width="177" height="65" name="PS" rx="3" ry="3" class="actor actor-top"/>
        <text x="297" y="32.5" class="actor actor-box">
          <tspan x="297" dy="0">Python HTTP server</tspan>
