      <g id="root-3624" data-et="participant" data-type="participant" data-id="RB">
        <rect x="0" y="0" width="150" height="65" name="RB" rx="3" ry="3" class="actor actor-top"/>
        <text x="75" y="32.5" class="actor actor-box">
          <tspan x="75" dy="0">Rebuild script</tspan>
        </text>
      </g>
    </g>
    <g/>
    <g data-et="note" data-id="i0">
      <rect x="206" y="75" width="182" height="39" class="note"/>
      <text x="297" y="80" class="noteText" dy="1.2em">
        <tspan x="297">reload_event.wait()</tspan>
      </text>
    </g>
    <g data-et="note" data-id="i1">
      <rect x="447" y="124" width="212" height="39" class="note"/>
      <text x="553" y="129" class="noteText" dy="1.2em">
        <tspan x="553">Browser window loads</tspan>
      </text>
    </g>
    <g data-et="note" data-id="i4">
