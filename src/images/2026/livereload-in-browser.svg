    <line x1="552" y1="211" x2="301" y2="211" class="messageLine0" data-et="message" data-id="i2" data-from="WB" data-to="PS" stroke-width="2" stroke="none" style="fill: none;" marker-end="url(#graph-592-arrowhead)"/>
    <text x="183" y="275" dy="1.2em">reload_event.set()</text>
    <line x1="76" y1="308" x2="293" y2="308" class="messageLine0" data-et="message" data-id="i5" data-from="RB" data-to="PS" stroke-width="2" stroke="none" style="fill: none;" marker-end="url(#graph-592-arrowhead)"/>
    <text x="426" y="390" dy="1.2em">HTTP 200 OK ("reload")</text>
    <line x1="298" y1="423" x2="549" y2="423" class="messageLine0" data-et="message" data-id="i7" data-from="PS" data-to="WB" stroke-width="2" stroke="none" style="fill: none;" marker-end="url(#graph-592-arrowhead)"/>
